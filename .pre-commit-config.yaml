# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # docs_v2/08_Epics holds archived story plans that were never valid YAML:
        # several open with an HTML comment line and use flow mappings whose keys
        # contain unquoted "[", "]" and ".". They are historical prose artefacts,
        # not configuration, so they are documented rather than rewritten.
        exclude: ^docs_v2/08_Epics/
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending

  # Formatting + linting (replaces black, isort, flake8, pylint)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff-format
      - id: ruff
        args: ['--fix']

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # Scan the code this repo ships, not the virtualenv. "-r ." walked .venv
        # and publisher_v2/tests and reported 13515 findings, ~11800 of them B101
        # (assert in a test), which drowned anything real and failed the hook on
        # every run. scripts/ is included because it is executed tooling.
        args: ['-r', 'publisher_v2/src', 'scripts', '-f', 'json', '-o', 'bandit-report.json']
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Check for secrets in commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  # Python docstring checks
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ['--convention=google']
        # Anchored at the repo root, so "^tests/" never matched publisher_v2/tests/
        # and the suite was being docstring-checked. Alembic revisions are
        # generated files.
        exclude: ^(publisher_v2/tests/|publisher_v2/alembic/|tests/|docs/)

# Exclude patterns
exclude: |
  (?x)^(
      .*/\..*|
      .*\.ini|
      .*session\.json|
      .*/tmp/.*|
      .*/logs/.*|
      .*_cache/.*|
      .*/build/.*|
      .*/dist/.*
  )$
