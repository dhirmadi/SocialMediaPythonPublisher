[project]
name = "social-media-python-publisher"
version = "0.1.0"
description = "Automate social media content distribution with AI-generated captions"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<4.0"
dependencies = [
    "dropbox>=11.0.0",
    "python-telegram-bot>=20.0",
    "pillow>=10.0.0",
    # Capped below 3.0: instagrapi 3.x swaps the HTTP transport to curl-cffi and
    # changes session persistence, which this repo's mocked tests cannot verify.
    # 2.6.9 is what the advisory fix requires; the major bump is its own change.
    "instagrapi>=2.6.9,<3",
    "openai>=1.7.2",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "PyYAML>=6.0.0",
    "authlib>=1.6.5",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "boto3>=1.42.88",
    "python-multipart>=0.0.26",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-watch>=4.2.0",
    "pre-commit>=3.6.0",
    "safety>=3.2.0",
    "pytest-asyncio>=0.23.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.33.0.20260327",
    "boto3-stubs>=1.42.88",
    "aiosqlite>=0.21.0",
    "pytest-randomly>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publisher_v2/src/publisher_v2"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["publisher_v2/src"]
extend-exclude = ["code_v1", "docs_v1"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
    "ASYNC", # flake8-async
    "D",     # pydocstyle (google convention, configured below)
]
ignore = ["E501", "B008", "S104", "S105", "S311"]

[tool.ruff.lint.pydocstyle]
# Match the pre-commit pydocstyle hook exactly. Ruff is the enforcer that
# actually covers the whole tree: pydocstyle 6.3.0 cannot parse PEP 695
# generics, so it silently skips config/runtime_cache.py and
# config/credential_cache.py while reporting them clean.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"publisher_v2/tests/**/*.py" = ["S101", "S106", "D"]  # assert, fixture passwords, and docstrings not required in tests
"scripts/**/*.py" = ["S106"]  # hardcoded passwords in script fixtures
"publisher_v2/alembic/**/*.py" = ["D"]  # generated migration revisions

[tool.ruff.lint.isort]
known-first-party = ["publisher_v2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["code_v1", "docs_v1", "build", "dist"]

[tool.coverage.run]
# #141: measure the source tree only — `--cov=.` also counted tests and tools,
# which inflated the figure the CLAUDE.md gates are written against.
source = ["publisher_v2/src/publisher_v2"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
pythonpath = ["publisher_v2/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["publisher_v2/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: mark test as an asyncio test",
    "slow: mark test as slow (opt-in; see the test's skipif for its env flag)",
]
addopts = [
    "-v",
    "--tb=short",
    # #141: pytest resolves addopts from rootdir, so the gate holds even when
    # pytest is invoked from a subdirectory (coverage's own config lookup is
    # cwd-relative and would silently drop fail_under there). Inert when no
    # --cov is passed. Partial runs that legitimately cover little should pass
    # --cov-fail-under=0 explicitly.
    "--cov-fail-under=85",
]
