name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly full-history sweep (verified findings only), as security-scan.yml's
  # weekly run did before TruffleHog moved here (PUB-084, #295).
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
        # Pinned to a commit SHA (PUB-055); bump it together with the trailing
        # version comment and the `version` input below when moving to a newer
        # TruffleHog release. The action is a wrapper around `docker run`, so
        # without `version` the scanner image would float on `:latest`.
        # PR/push scan the diff in default mode (unverified findings included);
        # schedule/manual runs scan the full history (fetch-depth: 0 above)
        # and report verified findings only.
        with:
          version: "3.97.9"
          extra_args: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--only-verified' || '' }}
