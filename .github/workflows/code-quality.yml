name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Run ruff format (code formatting check)
      run: |
        uv run ruff format --check --diff .

    - name: Run ruff check (linting)
      run: |
        uv run ruff check .

    - name: Run mypy (type checking)
      run: |
        uv run mypy publisher_v2/src --ignore-missing-imports

  pre-commit:
    # Enforces .pre-commit-config.yaml in CI, not only on whichever machines
    # happen to have run `pre-commit install`. Four of its hooks —
    # detect-secrets, gitleaks, pydocstyle and an actually-gating bandit — run
    # nowhere else: the bandit step in security-scan.yml is `|| true`, so it
    # uploads a report rather than failing a build. Until this job existed, a
    # clone without the git hook installed was subject to none of them, and the
    # config described a posture the repo did not have.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Cache pre-commit hook environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run every pre-commit hook
      # --show-diff-on-failure makes a formatting or baseline failure readable
      # from the log alone. Note detect-secrets rewrites .secrets.baseline to
      # correct drifted line numbers and then fails; if this job goes red on
      # that file, run `uv run pre-commit run detect-secrets --all-files`
      # locally, stage the result, and commit it. Do not hand-edit the baseline.
      run: |
        uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Run tests with coverage
      env:
        WEB_SESSION_SECRET: ci-only-secret
        # #145: runs the documented `uv run mypy ...` command end to end and
        # asserts it exits 0. Skipped locally (a full mypy pass per test run);
        # CI is where that criterion has to hold.
        RUN_SLOW_DOC_CHECKS: "1"
      run: |
        uv run pytest --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  caption-eval:
    # PUB-049: the offline caption evaluation harness. No key, no network, no
    # extra permissions — it only reads the committed fixtures and fails the
    # build when a metric crosses its bar in caption_eval_thresholds.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Score the committed caption snapshot (offline)
      run: |
        uv run python scripts/caption_eval.py --offline
