name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up uv and the project
      uses: ./.github/actions/setup

    # TruffleHog lives in secret-scan.yml, which scans the diff on pull_request
    # and push and the full history on its weekly schedule (PUB-084, #295).
    # Nothing here needs full history, so this checkout stays shallow.

    - name: Verify .env not committed
      run: |
        make check-secrets

    # Kept last so the cheap checks above still report while the advisory
    # backlog stands (PUB-055).
    - name: Run pip-audit (dependency vulnerabilities)
      run: |
        set -euo pipefail
        IGNORE_ARGS=$(uv run python scripts/pip_audit_ignore.py)
        uv export --frozen --no-emit-project --all-groups --no-hashes --format requirements-txt -o requirements-audit.txt
        uvx --from 'pip-audit==2.10.1' pip-audit --no-deps --disable-pip -r requirements-audit.txt \
          -f json -o pip-audit-report.json $IGNORE_ARGS

    - name: Upload security scan artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: security-scan-artifacts
        path: |
          pip-audit-report.json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Dependency Review
      uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4  # v3 (3.1.5 release merge)
      with:
        fail-on-severity: moderate

  secret-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: GitGuardian scan
      if: ${{ env.GITGUARDIAN_API_KEY != '' }}
      uses: GitGuardian/ggshield-action@7f66d3be9c59a821dcf4f45ee5d929203a1a0b90  # v1.55.0
      env:
        GITGUARDIAN_API_KEY: ${{ env.GITGUARDIAN_API_KEY }}
        GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
        GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
