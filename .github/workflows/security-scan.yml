name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
      with:
        # The action is a thin wrapper around `docker run`; without an explicit
        # `version` it pulls `:latest`, so the scanner that decides pass/fail
        # would float even though the action itself is SHA-pinned (PUB-055).
        version: "3.97.9"
        extra_args: --only-verified

    - name: Verify .env not committed
      run: |
        if git ls-files | grep -E '\.env$|.*\.ini$' | grep -v '\.example$' | grep -v 'alembic\.ini$'; then
          echo "❌ ERROR: Sensitive files found in repository!"
          echo "The following files should not be committed:"
          git ls-files | grep -E '\.env$|.*\.ini$' | grep -v '\.example$' | grep -v 'alembic\.ini$'
          exit 1
        else
          echo "✅ No sensitive files found in repository"
        fi

    - name: Check file permissions
      run: |
        echo "Checking for world-readable sensitive files..."
        # This would be more relevant for deployed instances
        # For repo, we just verify .gitignore is configured
        if [ -f .gitignore ]; then
          echo "✅ .gitignore exists"
          grep -q "\.env" .gitignore && echo "✅ .env in .gitignore" || echo "⚠️  .env not in .gitignore"
          grep -q "\.ini" .gitignore && echo "✅ .ini in .gitignore" || echo "⚠️  .ini not in .gitignore"
        fi

    # Kept last so the cheap checks above still report while the advisory
    # backlog stands (PUB-055).
    - name: Run pip-audit (dependency vulnerabilities)
      run: |
        set -euo pipefail
        IGNORE_ARGS=$(uv run python scripts/pip_audit_ignore.py)
        uv export --frozen --no-emit-project --all-groups --no-hashes --format requirements-txt -o requirements-audit.txt
        uvx --from 'pip-audit==2.10.1' pip-audit --no-deps --disable-pip -r requirements-audit.txt \
          -f json -o pip-audit-report.json $IGNORE_ARGS

    - name: Upload security scan artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: security-scan-artifacts
        path: |
          pip-audit-report.json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        fetch-depth: 0

    - name: Dependency Review
      uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4  # v3 (3.1.5 release merge)
      with:
        fail-on-severity: moderate

  secret-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        fetch-depth: 0

    - name: GitGuardian scan
      if: ${{ env.GITGUARDIAN_API_KEY != '' }}
      uses: GitGuardian/ggshield-action@7f66d3be9c59a821dcf4f45ee5d929203a1a0b90  # v1.55.0
      env:
        GITGUARDIAN_API_KEY: ${{ env.GITGUARDIAN_API_KEY }}
        GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
        GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
