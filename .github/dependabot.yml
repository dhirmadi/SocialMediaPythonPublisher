version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        update-types: ["minor", "patch"]
  # `pip` does read this repo's `pyproject.toml` (GitHub supports PEP 621), but not
  # `uv.lock` — and every direct dependency there is a bare `>=` lower bound, so it
  # rarely has a bump to propose on its own. The `uv` ecosystem is what actually
  # updates the lockfile (PUB-055). Whether the `pip` entry still earns its place,
  # given that overlap, is PUB-072.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-dependencies:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
